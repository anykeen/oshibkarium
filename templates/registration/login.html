{% extends  'base.html' %}
{% load crispy_forms_tags %}

{% block main %}
<div class="card">
    <div class="card-body">
        <h4 class="card-title">Войти</h4>
        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">

            {{ form|crispy }}

            <button type="submit" class="btn btn-primary btn-block">Войти</button>
        </form>
        <a href="/accounts/password_reset/">Забыли пароль?</a>
    </div>
</div>
{% endblock %}

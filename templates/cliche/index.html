{% extends 'base.html' %} {% block main %}
<form>
    <div class="form-group">
      <label for="cliche">Штамп</label>
      <input type="text" class="form-control" id="cliche">
      <input type="hidden" value="{{ user.profile }}" id="author">
    </div>
    <button type="submit" class="btn btn-primary add-cliche">Submit</button>
  </form>
{% if result %}
<p>ololo</p>
{% endif %}
<ul>
    {% for c in cliche %}
    <li>{{ c.cliche }} -- {{ c.author }}
        {% if c in user.profile.voted.all %}
            <span>already voted</span>
        {% else %}
            <a href="" class="pos-vote" data-id="{{ c.id }}">+</a> / <a href="" class="neg-vote" data-id="{{ c.id }}">-</a></li>
        {% endif %}
    {% endfor %}
</ul>
{% endblock %}

{% extends 'base.html' %}
{% block main %}
<div class="row">
    <div class="col-12 col-md-6 mx-auto my-5">{{ page.content | safe }}</div>
</div>
<div class="row">
    {% for cat in cats %}
    <div class="col-12 col-lg-3">
        <h3>{{ cat.title }}</h3>
        {% for card in cat.cards.all %}
        <div class="card mb-3">
            <div class="card-body">
                <div class="row">
                    <div class="col-4">
                        {% if card.image %}
                        <img class="mx-auto w-100" src="{{ card.image.url }}">
                        {% endif %}
                    </div>
                    <div class="col-8">
                        <h5 class="card-title">{{ card.title }}</h5>
                        <a href="{% url 'card_detail' slug=card.slug %}"><p class="card-text">{{ card.excerpt }}</p></a>
                    </div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
    {% endfor %}
</div>
{% endblock %}

{% extends 'base.html' %}
{% block main %}
<div class="row">
    <div class="col-12 col-md-6 mx-auto my-5">{{ page.content | safe }}</div>
</div>
<div class="row">
    {% for cat in cats %}
    <div class="col-12 col-lg-3">
        <h3>{{ cat.title }}</h3>
        {% for card in cat.cards.all %}
        <div class="card mb-3">
            <div class="card-body">
                <h5 class="card-title">{{ card.title }}</h5>
                <p class="card-text">{{ card.excerpt }}</p>
                <a href="{% url 'card_detail' slug=card.slug %}" class="card-link">Подробнее</a>
            </div>
        </div>
        {% endfor %}
    </div>
    {% endfor %}
</div>
{% endblock %}

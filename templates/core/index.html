{% extends 'base.html' %}
{% block main %}
<div class="row">
    <div class="col-12 col-md-6 mx-auto my-5">{{ page.content | safe }}</div>
</div>
<div class="row">
    {% regroup cards by category as category_list %}
    {% for category in category_list %}
    <div class="col-12 col-md-4">
        <h3>{{ category.grouper }}</h3>
        {% for item in category.list %}
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">{{ item.title }}</h5>
                <p class="card-text">{{ item.excerpt }}</p>
                <a href="{% url 'card_detail' slug=item.slug %}" class="card-link">Подробнее</a>
            </div>
        </div>
        {% endfor %}
    </div>
    {% endfor %}
</div>
{% endblock %}
